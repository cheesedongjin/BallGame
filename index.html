<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공게임</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;600;800&display=swap');

  :root {
    --bg: #FFF8F0;
    --panel: #ffffff;
    --accent1: #FF3B5C;
    --accent2: #FFB800;
    --accent3: #00C4A7;
    --accent4: #7B5EA7;
    --accent5: #FF6B35;
    --text: #1a1a2e;
    --text-muted: #8a8a9a;
    --correct: #00C4A7;
    --wrong: #FF3B5C;
    --border: #e8e0f0;
    --shadow: rgba(123,94,167,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(255,59,92,0.05) 0%, transparent 50%),
      radial-gradient(circle at 90% 80%, rgba(0,196,167,0.05) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(123,94,167,0.03) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
  }

  .bg-shape {
    position: fixed; pointer-events: none; z-index: 0; border-radius: 50%;
  }
  .bg-shape.s1 {
    width: 220px; height: 220px;
    background: linear-gradient(135deg, rgba(255,59,92,0.07), rgba(255,184,0,0.07));
    top: -70px; right: -70px;
  }
  .bg-shape.s2 {
    width: 180px; height: 180px;
    background: linear-gradient(135deg, rgba(0,196,167,0.07), rgba(123,94,167,0.07));
    bottom: -50px; left: -50px;
  }
  .bg-shape.s3 {
    width: 70px; height: 70px;
    background: rgba(255,184,0,0.12);
    top: 30%; left: 3%;
    animation: floatBall 6s ease-in-out infinite;
  }
  .bg-shape.s4 {
    width: 45px; height: 45px;
    background: rgba(255,59,92,0.09);
    bottom: 22%; right: 4%;
    animation: floatBall 8s ease-in-out infinite reverse;
  }
  @keyframes floatBall {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-18px) rotate(180deg); }
  }

  #app {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
  }

  .card {
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 28px; padding: 32px;
    max-width: 680px; width: 100%;
    box-shadow: 0 8px 40px var(--shadow), 0 2px 0 0 var(--border);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--accent1), var(--accent2), var(--accent3), var(--accent4));
  }

  /* ── 타이틀 ── */
  #screen-title { text-align: center; }

  .title-deco {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-bottom: 6px;
  }
  .title-deco-ball {
    width: 26px; height: 26px; border-radius: 50%;
    animation: titleBallBounce 1.2s ease-in-out infinite;
  }
  .title-deco-ball:nth-child(1) { background: radial-gradient(circle at 35% 30%, #ff8fa3, #FF3B5C); box-shadow: 0 3px 0 #c4192e; animation-delay: 0s; }
  .title-deco-ball:nth-child(2) { background: radial-gradient(circle at 35% 30%, #ffe08a, #FFB800); box-shadow: 0 3px 0 #c49000; animation-delay: 0.15s; }
  .title-deco-ball:nth-child(3) { background: radial-gradient(circle at 35% 30%, #6eecd8, #00C4A7); box-shadow: 0 3px 0 #009e84; animation-delay: 0.3s; }
  @keyframes titleBallBounce {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  .game-title {
    font-family: 'Black Han Sans', cursive;
    font-size: clamp(3rem, 10vw, 5.5rem);
    line-height: 1.1;
    color: var(--text);
    margin-bottom: 4px;
    letter-spacing: 1px;
    position: relative;
    display: inline-block;
    
    /* 웹킷 전용 텍스트 테두리 기능으로 글자 경계선을 깔끔하게 */
    -webkit-text-stroke: 1px var(--bg); 
    /* 또는 은은한 그림자로 글자 형태 입체감 주기 */
    text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.05);
  }
  .game-title .t-red { color: var(--accent1); }
  .game-title .t-blue { color: #1a6fd4; }

  .game-subtitle {
    font-size: 0.75rem; color: var(--text-muted);
    margin-bottom: 28px; letter-spacing: 5px; text-transform: uppercase;
    font-weight: 700;
  }

  .best-banner {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(135deg, #FFF9E6, #FFF3F5);
    border: 2px solid #FFE0B2;
    border-radius: 16px; padding: 14px 24px; margin-bottom: 28px;
    box-shadow: 0 4px 0 #FFD082;
  }
  .best-banner .best-label { font-size:0.72rem;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;font-weight:700; }
  .best-banner .best-val { font-family:'Black Han Sans',cursive;font-size:2rem; color:var(--accent5); }
  .best-banner .best-crown { font-size:1.6rem; }

  .start-btn-wrap { margin-bottom: 22px; display: flex; justify-content: center; }
  .btn-start {
    font-family:'Black Han Sans',cursive;font-size:1.3rem;
    padding:18px 64px;border:none;border-radius:50px;
    background: var(--accent1);
    color:#fff;cursor:pointer;
    box-shadow: 0 6px 0 #c4192e, 0 8px 20px rgba(255,59,92,.3);
    transition:transform 0.1s, box-shadow 0.1s;
    letter-spacing: 1px;
  }
  .btn-start:hover { transform: translateY(-3px); box-shadow: 0 9px 0 #c4192e, 0 12px 28px rgba(255,59,92,.35); }
  .btn-start:active { transform: translateY(4px); box-shadow: 0 1px 0 #c4192e, 0 3px 8px rgba(255,59,92,.2); }
  .title-info{font-size:0.78rem;color:var(--text-muted);line-height:2;text-align:center;font-weight:600;}

  /* ── 게임 화면 ── */
  #screen-game { position:relative; padding:20px; }

  /* 카운트다운 오버레이 */
  #countdown-overlay {
    position:absolute;inset:0;z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(255,248,240,0.92);border-radius:26px;
    opacity:0;transition:opacity 0.3s;pointer-events:none;
    backdrop-filter: blur(4px);
  }
  #countdown-overlay.active{opacity:1;pointer-events:all;}
  #countdown-num{
    font-family:'Black Han Sans',cursive;font-size:6rem;
    color: var(--accent1);
    text-shadow: 0 8px 0 rgba(255,59,92,0.15);
    animation:cdPop 0.5s cubic-bezier(0.34,1.56,0.64,1);
    line-height: 1;
  }
  @keyframes cdPop{from{transform:scale(0.2) rotate(-15deg);opacity:0;}to{transform:scale(1) rotate(0deg);opacity:1;}}

  /* HUD */
  .hud{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .hud-qnum{
    font-family:'Black Han Sans',cursive;font-size:0.95rem;
    color: var(--accent4);
    background: #f0eef8; border-radius: 50px; padding: 5px 14px;
    border: 1.5px solid #d8d0f0;
  }
  .timer-wrap{display:flex;align-items:center;gap:10px;}
  .timer-bar-bg{
    width:130px;height:10px;
    background: #f0eef8;
    border-radius:6px;overflow:hidden;
    border: 1.5px solid var(--border);
  }
  .timer-bar{height:100%;border-radius:5px;transition:width 0.5s linear,background 0.5s;}
  .timer-text{
    font-family:'Black Han Sans',cursive;font-size:1.5rem;
    color: var(--accent3); min-width:38px;text-align:right;transition:color 0.3s;
  }
  .timer-text.waiting{color: var(--text-muted);}
  .timer-text.danger{color:var(--wrong);animation:tshake 0.25s infinite alternate;}
  @keyframes tshake{from{transform:translateX(-2px) rotate(-3deg);}to{transform:translateX(2px) rotate(3deg);}}
  .hud-score{
    font-family:'Black Han Sans',cursive;font-size:0.95rem;
    color: var(--accent5);
    background: #FFF5E8; border-radius: 50px; padding: 5px 14px;
    border: 1.5px solid #FFE5C4;
  }

  /* 문제 배너 */
  .question-banner{
    background: linear-gradient(135deg, #f5f0ff, #e8f8f5);
    border: 2px solid var(--border);
    border-radius: 16px;padding:13px 16px;margin-bottom:14px;
    display:flex;align-items:flex-start;gap:12px;
  }
  .q-num{
    font-family:'Black Han Sans',cursive;font-size:0.7rem;
    color: #fff;
    background: var(--accent4);
    border-radius: 8px;padding:3px 10px;white-space:nowrap;
    flex-shrink: 0; margin-top: 2px;
  }
  .q-text{font-size:0.9rem;font-weight:700;color:var(--text);line-height:1.5;}

  /* 진행 도트 */
  .progress-dots{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .dot{width:10px;height:10px;border-radius:50%;background:#e8e0f0;transition:all 0.3s;}
  .dot.done  {background:var(--correct);box-shadow:0 2px 0 #009e84;}
  .dot.active{background:var(--accent2);box-shadow:0 3px 0 #c49000;transform:scale(1.45);}
  .dot.failed{background:var(--wrong);box-shadow:0 2px 0 #c4192e;}

  /* 공 개수 힌트 칩 */
  .ball-count-chip{
    display:inline-flex;align-items:center;gap:6px;
    background: #e8f8f5; border: 1.5px solid #b8ede6;
    border-radius:50px;padding:5px 14px;margin-bottom:12px;
    font-size:0.75rem;color:var(--accent3);
    font-family:'Black Han Sans',cursive;
  }

  /* 공 영역 */
  .ball-area{display:flex;align-items:center;justify-content:center;min-height:200px;}
  .ball-grid{display:grid;}

  /* 공 기본 */
  .ball{
    width:var(--ball-sz,52px);height:var(--ball-sz,52px);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Black Han Sans',cursive;font-size:var(--ball-fs,0.95rem);
    cursor:pointer;position:relative;
    transition:transform 0.15s,box-shadow 0.15s,opacity 0.2s;
    user-select:none;opacity:0;transform:scale(0);
    color: #fff;
  }
  .ball.visible{animation:popIn 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards;}
  @keyframes popIn{from{transform:scale(0) rotate(-20deg);opacity:0;}to{transform:scale(1) rotate(0deg);opacity:1;}}
  .ball:hover:not(.selected){transform:scale(1.15) rotate(5deg);}
  .ball.selected{opacity:0.22!important;transform:scale(0.8)!important;cursor:default;pointer-events:none;}
  .ball.correct-flash{animation:correctFlash 0.5s ease forwards;}
  @keyframes correctFlash{
    0%  {transform:scale(1);}
    30% {transform:scale(1.45) rotate(10deg);filter:brightness(1.5);}
    100%{transform:scale(0.8);opacity:0.22;}
  }
  .ball.wrong-flash{animation:wrongFlash 0.42s ease;}
  @keyframes wrongFlash{
    0%,100%{transform:translateX(0) rotate(0);}
    20%,60%{transform:translateX(-8px) rotate(-6deg);}
    40%,80%{transform:translateX(8px) rotate(6deg);}
  }

  /* 12색 공 — 밝고 선명하고 입체적 */
  .bc0 {background:radial-gradient(circle at 32% 28%,#93c8ff,#1a6fd4);box-shadow:0 5px 0 #1255a8,0 7px 16px rgba(26,111,212,.3);}
  .bc1 {background:radial-gradient(circle at 32% 28%,#ffafc4,#e82060);box-shadow:0 5px 0 #b31048,0 7px 16px rgba(232,32,96,.3);}
  .bc2 {background:radial-gradient(circle at 32% 28%,#7bfcb8,#0fa960);box-shadow:0 5px 0 #0a824a,0 7px 16px rgba(15,169,96,.3);}
  .bc3 {background:radial-gradient(circle at 32% 28%,#ffe48a,#e09000);box-shadow:0 5px 0 #ab6e00,0 7px 16px rgba(224,144,0,.3);}
  .bc4 {background:radial-gradient(circle at 32% 28%,#d0aaff,#7b3fd8);box-shadow:0 5px 0 #5e2da8,0 7px 16px rgba(123,63,216,.3);}
  .bc5 {background:radial-gradient(circle at 32% 28%,#ffb07a,#e05020);box-shadow:0 5px 0 #a83c18,0 7px 16px rgba(224,80,32,.3);}
  .bc6 {background:radial-gradient(circle at 32% 28%,#6af0e8,#0cb8a8);box-shadow:0 5px 0 #098c80,0 7px 16px rgba(12,184,168,.3);}
  .bc7 {background:radial-gradient(circle at 32% 28%,#ff9090,#d01c1c);box-shadow:0 5px 0 #a21414,0 7px 16px rgba(208,28,28,.3);}
  .bc8 {background:radial-gradient(circle at 32% 28%,#c0f560,#5ca800);box-shadow:0 5px 0 #458000,0 7px 16px rgba(92,168,0,.3);}
  .bc9 {background:radial-gradient(circle at 32% 28%,#c8d4e8,#5870a0);box-shadow:0 5px 0 #405878,0 7px 16px rgba(88,112,160,.3);}
  .bc10{background:radial-gradient(circle at 32% 28%,#ff90d8,#c41880);box-shadow:0 5px 0 #961260,0 7px 16px rgba(196,24,128,.3);}
  .bc11{background:radial-gradient(circle at 32% 28%,#58f0c0,#08a068);box-shadow:0 5px 0 #067a50,0 7px 16px rgba(8,160,104,.3);}

  /* 공 하이라이트 반짝이 */
  .ball::after {
    content: '';
    position: absolute; top: 18%; left: 22%;
    width: 28%; height: 18%;
    background: rgba(255,255,255,0.55);
    border-radius: 50%; transform: rotate(-30deg);
    pointer-events: none;
  }

  /* 정답 순서 뱃지 */
  .order-badge{
    position:absolute;top:-6px;right:-6px;
    width:20px;height:20px;border-radius:50%;
    background: var(--accent2); color:#1a1a2e;font-size:0.6rem;
    font-family:'Black Han Sans',cursive;
    display:flex;align-items:center;justify-content:center;
    border:2px solid #fff;
    box-shadow: 0 2px 0 #c49000;
    animation:badgePop 0.25s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none;
  }
  @keyframes badgePop{from{transform:scale(0) rotate(-30deg);}to{transform:scale(1) rotate(0deg);}}

  /* 공통 버튼 */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 28px;border-radius:50px;border:none;
    font-family:'Black Han Sans',cursive;font-size:1rem;
    cursor:pointer;transition:all 0.1s;position:relative;overflow:hidden;
    letter-spacing: 0.5px;
  }
  .btn-primary {
    background: var(--accent1); color:#fff;
    box-shadow: 0 5px 0 #c4192e, 0 7px 16px rgba(255,59,92,.25);
  }
  .btn-primary:hover  { box-shadow: 0 7px 0 #c4192e; transform: translateY(-2px); }
  .btn-primary:active { box-shadow: 0 2px 0 #c4192e; transform: translateY(3px); }
  .btn-secondary{
    background:#f0eef8; color:var(--accent4);
    border: 2px solid var(--border);
    box-shadow: 0 4px 0 #d8d0f0;
  }
  .btn-secondary:hover  { box-shadow: 0 6px 0 #d8d0f0; transform: translateY(-2px); }
  .btn-secondary:active { box-shadow: 0 1px 0 #d8d0f0; transform: translateY(3px); }

  /* 완료 오버레이 */
  .q-complete-overlay{text-align:center;padding:24px;animation:fadeIn 0.35s ease;}
  @keyframes fadeIn{from{opacity:0;transform:scale(0.85);}to{opacity:1;transform:scale(1);}}
  .q-result-icon{font-size:3.5rem;display:block;margin-bottom:10px;animation:iconBounce 0.55s cubic-bezier(0.34,1.56,0.64,1);}
  @keyframes iconBounce{from{transform:scale(0) rotate(-20deg);}to{transform:scale(1) rotate(0deg);}}

  /* ── 결과 화면 ── */
  #screen-result{text-align:center;}
  .result-emoji{font-size:5rem;margin-bottom:10px;animation:bounce 0.8s ease infinite alternate;}
  @keyframes bounce{from{transform:translateY(0) rotate(-5deg);}to{transform:translateY(-16px) rotate(5deg);}}
  .result-title{font-family:'Black Han Sans',cursive;font-size:2.4rem;margin-bottom:6px;color:var(--text);}
  .result-score{
    font-family:'Black Han Sans',cursive;font-size:3.5rem;
    color: var(--accent1);
    text-shadow: 0 6px 0 rgba(255,59,92,0.12);
    margin-bottom:6px;
  }
  .result-detail{font-size:0.85rem;color:var(--text-muted);margin-bottom:14px;font-weight:700;}

  .new-record-banner{
    display:none;
    background: linear-gradient(135deg, #FFF9E6, #FFF0E0);
    border: 2px solid var(--accent2);
    border-radius:16px;padding:10px 20px;
    font-family:'Black Han Sans',cursive;font-size:1rem;color:var(--accent5);
    margin-bottom:16px;
    animation:recordPop 0.5s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 4px 0 #c49000;
  }
  .new-record-banner.show{display:block;}
  @keyframes recordPop{from{transform:scale(0.8) rotate(-3deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}

  .result-breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
  .rb-item{
    background: #f8f6fd; border: 2px solid var(--border);
    border-radius:16px;padding:14px;text-align:center;
    box-shadow: 0 3px 0 var(--border);
  }
  .rb-val{font-family:'Black Han Sans',cursive;font-size:1.8rem;color:var(--accent4);display:block;}
  .rb-label{font-size:0.7rem;color:var(--text-muted);font-weight:700;letter-spacing:1px;}

  .best-row{
    display:flex;align-items:center;justify-content:center;gap:12px;
    margin-bottom:24px;padding:14px 20px;
    background: linear-gradient(135deg, #FFF9E6, #FFF0E0);
    border: 2px solid #FFE5B4; border-radius:16px;
    box-shadow: 0 4px 0 #FFD082;
  }
  .best-row .br-label{font-size:0.75rem;color:var(--text-muted);font-weight:700;letter-spacing:1px;}
  .best-row .br-val{font-family:'Black Han Sans',cursive;font-size:1.6rem;color:var(--accent5);}

  .result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  /* 토스트 */
  #toast{
    position:fixed;top:20px;left:50%;
    transform:translateX(-50%) translateY(-100px);
    background:var(--panel);
    border: 2px solid var(--border);
    border-radius:50px;padding:10px 22px;
    font-family:'Black Han Sans',cursive;font-size:0.88rem;
    z-index:999;transition:transform 0.38s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow:0 5px 0 var(--border), 0 8px 24px var(--shadow);
    pointer-events:none;white-space:nowrap;letter-spacing: 0.5px;
  }
  #toast.show{transform:translateX(-50%) translateY(0);}
  #toast.t-correct{border-color:var(--correct);color:var(--correct);background:#e8fdf8;box-shadow:0 5px 0 #b8ede6;}
  #toast.t-wrong  {border-color:var(--wrong);  color:var(--wrong);background:#fef0f2;box-shadow:0 5px 0 #ffc8d0;}
  #toast.t-info   {border-color:var(--accent4);color:var(--accent4);background:#f0eef8;box-shadow:0 5px 0 #d8d0f0;}

  .screen{display:none;} .screen.active{display:block;}

  @media(max-width:540px){
    .card{padding:16px 12px;}
    .ball-grid{gap:4px!important;}
    .timer-bar-bg{width:100px;}
  }
</style>
</head>
<body>
<div class="bg-shape s1"></div>
<div class="bg-shape s2"></div>
<div class="bg-shape s3"></div>
<div class="bg-shape s4"></div>
<div id="toast"></div>

<div id="app">

  <!-- ══ 타이틀 ══ -->
  <div id="screen-title" class="screen card active">
    <div class="title-deco">
      <div class="title-deco-ball"></div>
      <div class="title-deco-ball"></div>
      <div class="title-deco-ball"></div>
    </div>
    <div style="position:relative;display:inline-block;width:100%;text-align:center;margin-bottom:4px;">
      <h1 class="game-title"><span class="t-red">공</span><span class="t-blue">게</span>임</h1>
    </div>
    <p class="game-subtitle">Ball Game</p>

    <div class="best-banner">
      <span class="best-crown">👑</span>
      <span class="best-label">최고 점수</span>
      <span class="best-val" id="title-best">—</span>
    </div>

    <div class="start-btn-wrap">
      <button class="btn-start" onclick="startGame()">🎮 게임 시작!</button>
    </div>

    <p class="title-info">
      ⏱ 문제당 40초 제한 &nbsp;|&nbsp; 총 10문제
    </p>
  </div>

  <!-- ══ 게임 화면 ══ -->
  <div id="screen-game" class="screen card">
    <div id="countdown-overlay">
      <div id="countdown-num">준비!</div>
    </div>

    <div class="hud">
      <span class="hud-qnum" id="hud-qnum">1 / 10</span>
      <div class="timer-wrap">
        <div class="timer-bar-bg">

<script>
// ══════════════════════════════════════════════════
//  상수
// ══════════════════════════════════════════════════
const TIMER_SEC      = 40;
const TOTAL_Q        = 10;
const BALL_DELAY_MS       = 22;   // 일반 문제 공 등장 간격 (ms)
const BALL_DELAY_BIRTH_MS = 480;  // 생성순서 문제 공 등장 간격 (ms) — 천천히
const TIMER_DELAY_MS = 300;  // 마지막 공 후 타이머 시작 딜레이
const BEST_KEY       = 'ballgame_best';

// ══════════════════════════════════════════════════
//  최고 점수 (localStorage)
// ══════════════════════════════════════════════════
function getBest(){ try{ return parseInt(localStorage.getItem(BEST_KEY))||0; }catch(e){ return 0; } }
function setBest(v){ try{ localStorage.setItem(BEST_KEY,String(v)); }catch(e){} }
function updateBestUI(){
  const b=getBest();
  const txt=b>0?b.toLocaleString()+'점':'—';
  const e1=document.getElementById('title-best');
  const e2=document.getElementById('result-best');
  if(e1)e1.textContent=txt;
  if(e2)e2.textContent=txt;
}

// ══════════════════════════════════════════════════
//  유틸
// ══════════════════════════════════════════════════
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]; } return a; }

function createUniqueDigitPicker(){
  const used = new Set();
  const digits = Array.from({length:9}, (_,i) => i + 1);

  return count => {
    const fresh = digits.filter(d => !used.has(d));
    const source = fresh.length >= count ? fresh : digits;
    const picked = shuffle(source).slice(0, count);
    picked.forEach(d => used.add(d));
    return picked;
  };
}

function cornerIndex(pos, total, cols){
  const rows = Math.ceil(total / cols);
  const lastRowStart = (rows - 1) * cols;
  if(pos === '왼쪽 위') return 0;
  if(pos === '오른쪽 위') return Math.min(cols - 1, total - 1);
  if(pos === '왼쪽 아래') return Math.min(lastRowStart, total - 1);
  return total - 1;
}

function neighborIndices(index, total, cols){
  const row = Math.floor(index / cols);
  const col = index % cols;
  const result = [];
  for(let dr=-1; dr<=1; dr++){
    for(let dc=-1; dc<=1; dc++){
      if(dr === 0 && dc === 0) continue;
      const nr = row + dr;
      const nc = col + dc;
      const ni = nr * cols + nc;
      if(nr >= 0 && nc >= 0 && nc < cols && ni >= 0 && ni < total) result.push(ni);
    }
  }
  return result;
}

function buildNeighborChain(nums, cols, startPos, preferLargest=false){
  const visited = new Set();
  const chain = [];
  let current = cornerIndex(startPos, nums.length, cols);

  while(current !== undefined){
    visited.add(current);
    chain.push(nums[current]);

    const next = neighborIndices(current, nums.length, cols)
      .filter(i => !visited.has(i))
      .sort((a,b) => preferLargest ? nums[b] - nums[a] || a - b : nums[a] - nums[b] || a - b)[0];

    current = next;
  }

  return chain;
}

function buildAlternatingLineOrder(nums, cols, startLine, asc){
  const rows = [
    nums.slice(0, cols),
    nums.slice(cols, cols * 2)
  ].map(line => line.slice().sort((a,b) => asc ? a-b : b-a));
  let rowIndex = startLine === '윗줄' ? 0 : 1;
  const order = [];

  while(rows[0].length || rows[1].length){
    if(rows[rowIndex].length) order.push(rows[rowIndex].shift());
    rowIndex = rowIndex === 0 ? 1 : 0;
  }

  return order;
}

// ══════════════════════════════════════════════════
//  숫자 풀 생성 헬퍼 — generatePool
//
//  두 가지 모드:
//
//  [시퀀스 모드] isSequence: true
//    start~(start+count-1) 의 연속된 정수를 통째로 뽑아 셔플.
//    start = randInt(rangeMin, rangeMax - count + 1)
//    → 홀수/짝수처럼 "다음 숫자를 눈으로 예측"할 수 있어야 하는 직관형 문제에 사용.
//
//  [보물찾기 모드] isSequence: false (기본)
//    guaranteed 배열을 씨앗으로 넣고, [rangeMin, rangeMax] 전체에서
//    나머지를 무작위로 채워 count개를 완성한 뒤 셔플.
//    → 시각 탐색형 문제(369, 자릿수 대소, 일의자리N…)에 사용.
//
//  공통: 최종 결과는 항상 shuffle() 적용 (격자 위치 랜덤화).
// ══════════════════════════════════════════════════
function generatePool({ count, rangeMin, rangeMax, guaranteed=[], isSequence=false }){
  if(isSequence){
    // 연속 수 묶음: 시작점 랜덤
    const maxStart = rangeMax - count + 1;
    const start    = randInt(rangeMin, Math.max(rangeMin, maxStart));
    const seq      = Array.from({length: count}, (_,i) => start + i);
    return shuffle(seq);
  } else {
    // 보물찾기: guaranteed 씨앗 + 나머지 무작위
    const gSet  = [...new Set(guaranteed.filter(n => n>=rangeMin && n<=rangeMax))];
    const gPick = shuffle(gSet).slice(0, count);
    const used  = new Set(gPick);
    const pool  = [];
    for(let n=rangeMin; n<=rangeMax; n++) if(!used.has(n)) pool.push(n);
    const result = [...gPick];
    for(const n of shuffle(pool)){
      if(result.length >= count) break;
      result.push(n);
    }
    return shuffle(result);
  }
}

// ══════════════════════════════════════════════════
//  문제 팩토리
//  각 factory() → 문제 설정 객체:
//    { label, totalBalls, cols, makeNums(), filter, textFn, forceAsc?, customSort?, needBirth? }
//    customSort(arr, birthByNum, ctx) 에는 { allNums, cols } 컨텍스트가 함께 전달됨
//
//  ★ 직관형 (isSequence:true)  — 연속 수 묶음, 홀짝·달력·시간처럼 흐름이 있는 문제
//  ★ 탐색형 (isSequence:false) — 넓은 범위 무작위, 시각 보물찾기 문제
// ══════════════════════════════════════════════════
function getFactories(){
  const dir = asc => asc ? '작은 것부터' : '큰 것부터';
  const pickExploreDigits = createUniqueDigitPicker();

  return [

    // ━━ 직관형 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    // ── 짝수  20개 5열 | 연속 20개 시퀀스(짝수 10개 포함) / 범위 1~40
    () => ({
      label:'짝수', totalBalls:20, cols:5,
      makeNums: () => generatePool({ count:20, rangeMin:1, rangeMax:40, isSequence:true }),
      filter: ns => ns.filter(n => n%2===0),
      textFn: asc => `짝수를 ${dir(asc)} 누르세요!`
    }),

    // ── 홀수  20개 5열 | 연속 20개 시퀀스(홀수 10개 포함) / 범위 1~40
    () => ({
      label:'홀수', totalBalls:20, cols:5,
      makeNums: () => generatePool({ count:20, rangeMin:1, rangeMax:40, isSequence:true }),
      filter: ns => ns.filter(n => n%2!==0),
      textFn: asc => `홀수를 ${dir(asc)} 누르세요!`
    }),

    // ── 한 자리 수  12개 4열 | 1~9 고정 + 10~19 보충 (연속 12개 / 1~19)
    () => ({
      label:'한 자리 수', totalBalls:12, cols:4,
      makeNums: () => generatePool({ count:12, rangeMin:1, rangeMax:19, isSequence:true }),
      filter: ns => ns.filter(n => n>=1 && n<=9),
      textFn: asc => `한 자리 수(1~9)인 공을 ${dir(asc)} 누르세요!`
    }),

    // ── 31일까지 있는 달  15개 5열 | 1~15 연속 시퀀스(12월까지 전부 포함)
    () => {
      const m31=[1,3,5,7,8,10,12];
      return {
        label:'31일까지 있는 달', totalBalls:15, cols:5,
        makeNums: () => generatePool({ count:15, rangeMin:1, rangeMax:15, isSequence:true }),
        filter: ns => ns.filter(n => m31.includes(n)),
        textFn: asc => `31일까지 있는 달(Month)을 ${dir(asc)} 누르세요!`
      };
    },

    // ── 30일까지만 있는 달  12개 4열 | 1~12 연속(달력 전체)
    () => {
      const m30=[4,6,9,11];
      return {
        label:"30일까지'만' 있는 달", totalBalls:12, cols:4,
        makeNums: () => generatePool({ count:12, rangeMin:1, rangeMax:12, isSequence:true }),
        filter: ns => ns.filter(n => m30.includes(n)),
        textFn: asc => `30일까지'만' 있는 달(Month)을 ${dir(asc)} 누르세요!`
      };
    },

    // ── 오전(AM) 시간 1~11  16개 4열 | 1~16 연속
    () => ({
      label:'오전(AM) 시간', totalBalls:16, cols:4,
      makeNums: () => generatePool({ count:16, rangeMin:1, rangeMax:16, isSequence:true }),
      filter: ns => ns.filter(n => n>=1 && n<=11),
      textFn: asc => `오전(AM) 시간을 나타내는 공을 ${dir(asc)} 누르세요! (24시간제)`
    }),

    // ── 오후(PM) 시간 12~23  16개 4열 | 9~24 연속
    () => ({
      label:'오후(PM) 시간', totalBalls:16, cols:4,
      makeNums: () => generatePool({ count:16, rangeMin:9, rangeMax:24, isSequence:true }),
      filter: ns => ns.filter(n => n>=12 && n<=23),
      textFn: asc => `오후(PM) 시간을 나타내는 공을 ${dir(asc)} 누르세요! (24시간제)`
    }),

    // ━━ 탐색형 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    // ── 십의 자리 = 일의 자리 (11,22…99)  20개 5열 | 10~99 보물찾기, 쌍둥이 전부 보장
    () => {
      const twins=[11,22,33,44,55,66,77,88,99];
      return {
        label:'십의 자리 = 일의 자리', totalBalls:20, cols:5,
        makeNums: () => generatePool({ count:20, rangeMin:10, rangeMax:99,
                          guaranteed: twins, isSequence:false }),
        filter: ns => ns.filter(n => { const s=String(n); return s.length===2&&s[0]===s[1]; }),
        textFn: asc => `십의 자리와 일의 자리 숫자가 같은 공을 ${dir(asc)} 누르세요!`
      };
    },

    // ── 3·6·9 포함  20개 5열 | 10~99 보물찾기, 해당 수 최소 7개 보장
    () => {
      const has369 = n => String(n).includes('3')||String(n).includes('6')||String(n).includes('9');
      const pool369 = Array.from({length:90},(_,i)=>i+10).filter(has369);
      return {
        label:'3, 6, 9가 들어간 수', totalBalls:20, cols:5,
        makeNums: () => generatePool({ count:20, rangeMin:10, rangeMax:99,
                          guaranteed: shuffle(pool369).slice(0,7), isSequence:false }),
        filter: ns => ns.filter(has369),
        textFn: asc => `3, 6, 9가 포함된 공을 ${dir(asc)} 누르세요!`
      };
    },

    // ── 일의 자리가 N  24개 6열 | 10~99 보물찾기, 해당 수 최소 6개 보장
    () => {
      const [d] = pickExploreDigits(1);
      const matching = Array.from({length:9},(_,i) => d + (i+1)*10); // 1d,2d,…,9d
      return {
        label:`일의 자리가 ${d}인 수`, totalBalls:24, cols:6,
        makeNums: () => generatePool({ count:24, rangeMin:10, rangeMax:99,
                          guaranteed: shuffle(matching).slice(0,6), isSequence:false }),
        filter: ns => ns.filter(n => n%10===d),
        textFn: asc => `일의 자리 숫자가 '${d}'인 공을 ${dir(asc)} 누르세요!`
      };
    },

    // ── N 또는 M으로 끝나는 수  24개 6열 | 10~99 보물찾기, 각 4개씩 보장
    () => {
      const [d1, d2] = pickExploreDigits(2);
      const m1 = Array.from({length:9},(_,i) => d1+(i+1)*10);
      const m2 = Array.from({length:9},(_,i) => d2+(i+1)*10);
      return {
        label:`'${d1}' 또는 '${d2}'으로 끝나는 수`, totalBalls:24, cols:6,
        makeNums: () => generatePool({ count:24, rangeMin:10, rangeMax:99,
                          guaranteed: [...shuffle(m1).slice(0,4), ...shuffle(m2).slice(0,4)],
                          isSequence:false }),
        filter: ns => ns.filter(n => n%10===d1 || n%10===d2),
        textFn: asc => `'${d1}' 또는 '${d2}'으로 끝나는 공을 ${dir(asc)} 누르세요!`
      };
    },

    // ── 숫자 N이 들어간 수  24개 6열 | 10~99 보물찾기, 최소 5개 보장
    () => {
      const d   = String(pickExploreDigits(1)[0]);
      const hasD = n => String(n).includes(d);
      const poolD = Array.from({length:90},(_,i)=>i+10).filter(hasD);
      return {
        label:`숫자 '${d}'이(가) 들어간 수`, totalBalls:24, cols:6,
        makeNums: () => generatePool({ count:24, rangeMin:10, rangeMax:99,
                          guaranteed: shuffle(poolD).slice(0,5), isSequence:false }),
        filter: ns => ns.filter(hasD),
        textFn: asc => `숫자 '${d}'이(가) 들어간 공을 ${dir(asc)} 누르세요!`
      };
    },

    // ── 십의 자리 > 일의 자리  24개 6열 | 10~99 보물찾기, 최소 8개 보장
    () => {
      const bigTen  = n => { const s=String(n); return s.length===2&&Number(s[0])>Number(s[1]); };
      const poolBT  = Array.from({length:90},(_,i)=>i+10).filter(bigTen);
      return {
        label:'십의 자리 > 일의 자리', totalBalls:24, cols:6,
        makeNums: () => generatePool({ count:24, rangeMin:10, rangeMax:99,
                          guaranteed: shuffle(poolBT).slice(0,8), isSequence:false }),
        filter: ns => ns.filter(bigTen),
        textFn: asc => `두 자리 수 중 십의 자리가 일의 자리보다 큰 공을 ${dir(asc)} 누르세요!`
      };
    },

    // ── 십의 자리 < 일의 자리  24개 6열 | 10~99 보물찾기, 최소 8개 보장
    () => {
      const smallTen = n => { const s=String(n); return s.length===2&&Number(s[0])<Number(s[1]); };
      const poolST   = Array.from({length:90},(_,i)=>i+10).filter(smallTen);
      return {
        label:'십의 자리 < 일의 자리', totalBalls:24, cols:6,
        makeNums: () => generatePool({ count:24, rangeMin:10, rangeMax:99,
                          guaranteed: shuffle(poolST).slice(0,8), isSequence:false }),
        filter: ns => ns.filter(smallTen),
        textFn: asc => `두 자리 수 중 십의 자리가 일의 자리보다 작은 공을 ${dir(asc)} 누르세요!`
      };
    },

    // ━━ 경로형 (특수) ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    // ── 줄바꿈 왕복 챌린지  12개 6열 | 시작 줄부터 두 줄을 번갈아 오가며 줄별 최솟값/최댓값 선택
    () => {
      const lines = ['윗줄', '아랫줄'];
      // 팩토리 실행 시점에 줄을 고정하되, 정답지 함수에 인자로 안전하게 전달
      const chosenLine = lines[Math.floor(Math.random() * lines.length)];
      
      return {
        label: '줄바꿈 왕복 챌린지', totalBalls: 12, cols: 6,
        makeNums: () => generatePool({ count: 12, rangeMin: 1, rangeMax: 99, isSequence: false }),
        filter: ns => [...ns],
        ballClassForIndex: (index, { cols }) => index < cols ? 'bc0' : 'bc5',
        // 기존 시스템은 인자를 (arr, birthByNum)만 주므로, 세 번째 인자 대신 내부 변수와 시스템이 결정해준 정답 배열(arr)을 활용하거나
        // loadQuestion 단에서 customSort 호출 시 세 번째 인자로 asc를 넣어주도록 코드를 한 줄 고치거나, 아래처럼 클로저 형태로 asc를 가져와야 합니다.
        // 여기서는 안전하게 호출 구조를 맞추기 위해 loadQuestion에서 customSort(rawTarget, birthByNum, qDef.asc) 형태로 인자를 3개 주도록 본문 코드를 수정했다고 가정하거나, 아래 방식을 권장합니다.
        customSort: (arr, birthByNum, qAsc) => {
          // 만약 기존 코드를 안 고치고 싶다면, startGame에서 결정된 asc를 주입받아야 하므로
          // customSort 내부에서 처리하기 위해 함수 구조를 본문 엔진에 맞추는 것이 좋습니다.
          return buildAlternatingLineOrder(state.allNums, 6, chosenLine, qAsc);
        },
        textFn: asc => {
          const sizeStr = asc ? '작은' : '큰';
          return `[${chosenLine}]부터 줄을 번갈아 오가며 각 줄의 가장 [${sizeStr}] 공을 누르세요!`;
        }
      };
    },

    // ── 모서리 체인 챌린지  20개 4열 | 시작 모서리에서 인접 8방향 최솟값으로 이동
    () => {
      const positions = ['왼쪽 위', '오른쪽 위', '왼쪽 아래', '오른쪽 아래'];
      const chosenPos = positions[Math.floor(Math.random() * positions.length)];
      return {
        label:'모서리 체인 챌린지', totalBalls:20, cols:4, forceAsc:true,
        makeNums: () => generatePool({ count:20, rangeMin:1, rangeMax:99, isSequence:false }),
        filter: ns => [...ns],
        customSort: (arr, birthByNum, ctx) => buildNeighborChain(ctx.allNums, ctx.cols, chosenPos),
        textFn: () => `시작점은 [${chosenPos}]! 이웃한 공(대각선 포함) 중 가장 작은 수로 이어가세요!`
      };
    },

    // ── 모서리 체인 챌린지 (큰 수)  20개 4열 | 시작 모서리에서 인접 8방향 최댓값으로 이동
    () => {
      const positions = ['왼쪽 위', '오른쪽 위', '왼쪽 아래', '오른쪽 아래'];
      const chosenPos = positions[Math.floor(Math.random() * positions.length)];
      return {
        label:'모서리 체인 챌린지 (큰 수)', totalBalls:20, cols:4, forceAsc:true,
        makeNums: () => generatePool({ count:20, rangeMin:1, rangeMax:99, isSequence:false }),
        filter: ns => [...ns],
        customSort: (arr, birthByNum, ctx) => buildNeighborChain(ctx.allNums, ctx.cols, chosenPos, true),
        textFn: () => `시작점은 [${chosenPos}]! 이웃한 공(대각선 포함) 중 가장 큰 수로 이어가세요!`
      };
    },

    // ━━ 생겨난 순서 (특수) ━━━━━━━━━━━━━━━━━━━━━━━━━

    // ── 공이 생겨난 순서  5개 5열 | 1~50 에서 랜덤 5개
    () => ({
      label:'공이 생겨난 순서', totalBalls:5, cols:5, forceAsc:true,
      makeNums: () => generatePool({ count:5, rangeMin:1, rangeMax:50, isSequence:false }),
      filter: ns => [...ns],
      needBirth: true,
      customSort: (arr, birthByNum) => arr.slice().sort((a,b) => birthByNum[a]-birthByNum[b]),
      textFn: () => `공이 생겨난 순서대로 누르세요!`
    }),

    // ── 공이 생겨난 역순  5개 5열 | 1~50 에서 랜덤 5개
    () => ({
      label:'공이 생겨난 역순', totalBalls:5, cols:5, forceAsc:false,
      makeNums: () => generatePool({ count:5, rangeMin:1, rangeMax:50, isSequence:false }),
      filter: ns => [...ns],
      needBirth: true,
      customSort: (arr, birthByNum) => arr.slice().sort((a,b) => birthByNum[b]-birthByNum[a]),
      textFn: () => `공이 생겨난 역순(가장 나중에 생긴 것부터)으로 누르세요!`
    }),

  ];
}

// ══════════════════════════════════════════════════
//  공 크기 계산 (totalBalls, cols 기반)
//  카드 최대 너비 ~640px 안에 딱 맞게
// ══════════════════════════════════════════════════
function calcBallSize(cols, totalBalls){
  const cardW = Math.min(window.innerWidth - 40, 640) - 64; // 카드 패딩 고려
  const gap    = 5;
  const maxByW = Math.floor((cardW - gap*(cols-1)) / cols);
  // 행 수에 따른 높이 제한
  const rows   = Math.ceil(totalBalls / cols);
  const maxH   = Math.min(400, window.innerHeight * 0.5);
  const maxByH = Math.floor((maxH - gap*(rows-1)) / rows);
  const sz     = Math.max(32, Math.min(72, maxByW, maxByH));
  const fs     = sz <= 38 ? '0.7rem' : sz <= 48 ? '0.82rem' : sz <= 58 ? '0.95rem' : '1.1rem';
  return { sz, fs };
}

// ══════════════════════════════════════════════════
//  게임 상태
// ══════════════════════════════════════════════════
let state = {};

// ── 게임 시작: 10문제 선택만 하고 실제 공 생성은 loadQuestion에서
function startGame(){
  const factories = shuffle(getFactories());

  const questions = [];
  const usedLabels = {};
  for(const factory of factories){
    if(questions.length >= TOTAL_Q) break;
    const raw = factory();
    // 같은 label은 최대 1회
    if(usedLabels[raw.label]) continue;
    usedLabels[raw.label] = true;

    const asc = raw.forceAsc !== undefined ? raw.forceAsc : (Math.random() < 0.5);
    questions.push({
      raw,
      rawLabel: raw.label,
      asc,
      // 아래는 loadQuestion에서 채워짐
      target:[], sorted:[], clicked:[], success:null,
      totalBalls: raw.totalBalls, cols: raw.cols,
      text: raw.textFn(asc),
    });
  }

  state = {
    questions,
    currentQ: 0,
    score: 0,
    correctCount: 0,
    wrongCount: 0,
    timeLeft: TIMER_SEC,
    totalTimeLeft: 0,
    timerInterval: null,
    gameActive: false,
    wrongStreak: 0,
    spawnTimers: [],
    // 현재 문제 전용 공 데이터 (loadQuestion에서 세팅)
    allNums: [],
    birthOrder: [],
    birthByNum: {},
  };

  showScreen('game');
  renderHUD();
  renderProgressDots();
  loadQuestion(0);
}

// ══════════════════════════════════════════════════
//  문제 로드 — 공 개수를 문제마다 새로 생성
// ══════════════════════════════════════════════════
function loadQuestion(qi){
  state.currentQ = qi;
  state.gameActive = false;
  state.timeLeft   = TIMER_SEC;
  state.wrongStreak = 0;

  // 스폰 타이머 정리
  state.spawnTimers.forEach(t=>clearTimeout(t));
  state.spawnTimers = [];

  // 타이머 UI 대기 상태
  const timerTxt = document.getElementById('timer-text');
  timerTxt.textContent = TIMER_SEC;
  timerTxt.className = 'timer-text waiting';
  const bar = document.getElementById('timer-bar');
  bar.style.width = '100%';
  bar.style.background = 'linear-gradient(90deg,var(--accent3),#1a6fd4)';

  // 이번 문제 설정 가져오기
  const qDef  = state.questions[qi];
  const raw   = qDef.raw;
  const COLS  = raw.cols;

  // 이 문제 전용 공 배열 생성 — makeNums()가 보장 정답 포함 랜덤 풀 반환
  const allNums    = raw.makeNums();
  const TB         = allNums.length;        // 실제 공 수
  const birthOrder = shuffle(Array.from({length:TB}, (_,i)=>i)); // gridIndex 순서
  const birthByNum = {};
  birthOrder.forEach((gi, rank) => { birthByNum[allNums[gi]] = rank+1; });

  state.allNums   = allNums;
  state.birthOrder= birthOrder;
  state.birthByNum= birthByNum;

  // 정답 계산
  const rawTarget = raw.filter(allNums);
  let sorted;
  if(raw.customSort){
    sorted = raw.customSort(rawTarget, birthByNum, { allNums, cols: COLS, asc: qDef.asc });
  } else {
    sorted = [...rawTarget].sort((a,b) => qDef.asc ? a-b : b-a);
  }

  qDef.target  = sorted;
  qDef.sorted  = sorted;
  qDef.clicked = [];

  // 공 크기 계산
  const {sz, fs} = calcBallSize(COLS, TB);

  // HUD
  document.getElementById('hud-qnum').textContent = `${qi+1} / ${TOTAL_Q}`;
  document.getElementById('q-num').textContent    = `문제 ${qi+1}`;
  document.getElementById('q-text').textContent   = raw.textFn(qDef.asc);
  renderProgressDots();

  // 공 개수 칩
  document.getElementById('ball-count-wrap').innerHTML =
    `<div class="ball-count-chip">🎱 공 ${TB}개</div>`;

  // 공 영역 복원
  const area = document.getElementById('ball-area');
  area.innerHTML = '<div class="ball-grid" id="ball-grid"></div>';
  const grid = document.getElementById('ball-grid');
  grid.style.gridTemplateColumns = `repeat(${COLS},1fr)`;
  grid.style.gap = '5px';
  // CSS 변수로 공 크기 전달
  grid.style.setProperty('--ball-sz', sz+'px');
  grid.style.setProperty('--ball-fs', fs);

  // 생성순서 문제 여부에 따라 공 등장 딜레이 분기
  const isBirthQ  = !!raw.needBirth;
  const spawnDelay = isBirthQ ? BALL_DELAY_BIRTH_MS : BALL_DELAY_MS;

  // 공 DOM 생성 (처음엔 invisible)
  allNums.forEach((num, index) => {
    const el = document.createElement('div');
    const ballClass = raw.ballClassForIndex
      ? raw.ballClassForIndex(index, { cols: COLS, totalBalls: TB, num, allNums })
      : `bc${randInt(0, 11)}`;
    el.className = `ball ${ballClass}`;
    el.style.setProperty('--ball-sz', sz+'px');
    el.style.setProperty('--ball-fs', fs);
    el.dataset.num = num;
    el.textContent = num;
    el.onclick = () => clickBall(el, num);
    // birth-label 표시 제거 — 생성순서는 암기로 승부
    grid.appendChild(el);
  });

  // 랜덤 순서로 순차 등장 (생성순서 문제는 느리게, 나머지는 빠르게)
  birthOrder.forEach((gridIdx, rank) => {
    const t = setTimeout(() => {
      const balls = grid.querySelectorAll('.ball');
      if(balls[gridIdx]) balls[gridIdx].classList.add('visible');
      // 마지막 공 등장 후 딜레이 → 타이머 시작
      if(rank === TB - 1){
        const st = setTimeout(() => {
          timerTxt.classList.remove('waiting');
          state.gameActive = true;
          startTimer();
        }, TIMER_DELAY_MS);
        state.spawnTimers.push(st);
      }
    }, rank * spawnDelay);
    state.spawnTimers.push(t);
  });
}

// ══════════════════════════════════════════════════
//  공 클릭
// ══════════════════════════════════════════════════
function clickBall(el, num){
  if(!state.gameActive) return;
  if(el.classList.contains('selected')) return;
  // ── 버그 1 방지: 정답 처리 중 재진입 차단 (빠른 연타 / 이벤트 중복)
  if(el.dataset.answering) return;

  const q = state.questions[state.currentQ];
  const isTarget = q.target.includes(num);

  if(!isTarget){
    el.classList.add('wrong-flash');
    setTimeout(()=>el.classList.remove('wrong-flash'), 480);
    state.wrongCount++;
    state.wrongStreak++;
    state.score = Math.max(0, state.score - 5);
    renderHUD();
    showToast(`❌ ${num}은(는) 해당 없음! (−5점)`, 'wrong');
    if(state.wrongStreak >= 3){ showToast('💡 문제를 다시 읽어보세요!','info'); state.wrongStreak=0; }
    return;
  }

  const nextExp = q.sorted[q.clicked.length];
  if(num !== nextExp){
    el.classList.add('wrong-flash');
    setTimeout(()=>el.classList.remove('wrong-flash'), 480);
    state.wrongCount++;
    state.wrongStreak = 0;
    state.score = Math.max(0, state.score - 5);
    renderHUD();
    showToast(`❌ 순서 오류! 다음은 ${nextExp} (−5점)`, 'wrong');
    return;
  }

  // 정답! — 즉시 잠금해 재진입 차단
  el.dataset.answering = '1';
  state.wrongStreak = 0;
  q.clicked.push(num);
  const orderNum = q.clicked.length;

  el.classList.add('correct-flash');
  // 뱃지가 이미 없을 때만 추가 (이중 방어)
  if(!el.querySelector('.order-badge')){
    const badge = document.createElement('div');
    badge.className = 'order-badge';
    badge.textContent = orderNum;
    el.appendChild(badge);
  }
  setTimeout(()=>{ el.classList.add('selected'); }, 360);

  const pts = 10 + state.timeLeft;
  state.score += pts;
  state.correctCount++;
  renderHUD();
  showToast(`✅ 정답! +${pts}점`, 'correct');

  if(q.clicked.length === q.sorted.length){
    state.totalTimeLeft += state.timeLeft;
    q.success = true;
    setTimeout(()=>endQuestion(true), 500);
  }
}

// ══════════════════════════════════════════════════
//  문제 종료
// ══════════════════════════════════════════════════
function endQuestion(success){
  state.gameActive = false;
  clearInterval(state.timerInterval);
  if(!success) state.questions[state.currentQ].success = false;

  if(state.currentQ < state.questions.length - 1){
    showNextPrompt(success);
  } else {
    endGame();
  }
}

function showNextPrompt(success){
  const area = document.getElementById('ball-area');
  document.getElementById('ball-count-wrap').innerHTML = '';
  area.innerHTML = `
    <div class="q-complete-overlay">
      <span class="q-result-icon">${success ? '🎯' : '⏰'}</span>
      <div style="font-family:'Jua',cursive;font-size:1.4rem;margin-bottom:8px">
        ${success ? '클리어!' : '시간 초과!'}
      </div>
      <div style="color:rgba(255,255,255,0.45);font-size:0.88rem;margin-bottom:18px">
        현재 점수: <strong style="color:var(--accent2)">${state.score.toLocaleString()}점</strong>
      </div>
      <button class="btn btn-primary" onclick="nextQuestion()">다음 문제 →</button>
    </div>`;
}

function nextQuestion(){
  loadQuestion(state.currentQ + 1);
}

// ══════════════════════════════════════════════════
//  타이머
// ══════════════════════════════════════════════════
function startTimer(){
  clearInterval(state.timerInterval);
  state.timerInterval = setInterval(()=>{
    if(!state.gameActive) return;
    state.timeLeft--;
    updateTimerUI();
    if(state.timeLeft <= 0){
      state.gameActive = false;
      clearInterval(state.timerInterval);
      showToast('⏰ 시간 초과!', 'wrong');
      if(state.currentQ < state.questions.length - 1){ showNextPrompt(false); }
      else { endGame(); }
    }
  }, 1000);
}

function updateTimerUI(){
  const t   = state.timeLeft;
  const bar = document.getElementById('timer-bar');
  const txt = document.getElementById('timer-text');
  bar.style.width = (t/TIMER_SEC*100)+'%';
  txt.textContent = t;
  txt.classList.remove('waiting');
  if(t<=8){
    bar.style.background='linear-gradient(90deg,var(--wrong),#ff8a65)';
    txt.classList.add('danger');
  } else if(t<=15){
    bar.style.background='linear-gradient(90deg,var(--accent2),var(--accent5))';
    txt.classList.remove('danger');
  } else {
    bar.style.background='linear-gradient(90deg,var(--accent3),#1a6fd4)';
    txt.classList.remove('danger');
  }
}

// ══════════════════════════════════════════════════
//  게임 종료
// ══════════════════════════════════════════════════
function endGame(){
  clearInterval(state.timerInterval);
  state.spawnTimers.forEach(t=>clearTimeout(t));

  const total = state.questions.reduce((a,q)=>a+q.sorted.length, 0);
  const pct   = total>0 ? Math.round(state.correctCount/total*100) : 0;

  const prevBest = getBest();
  const isNew    = state.score > prevBest;
  if(isNew) setBest(state.score);

  let emoji='😅', title='아깝다!';
  if(pct===100){ emoji='🏆'; title='완벽 클리어!'; }
  else if(pct>=80){ emoji='🎉'; title='훌륭해요!'; }
  else if(pct>=60){ emoji='😊'; title='잘 했어요!'; }
  else if(pct>=40){ emoji='👍'; title='좋아요!'; }

  document.getElementById('result-emoji').textContent  = emoji;
  document.getElementById('result-title').textContent  = title;
  document.getElementById('result-score').textContent  = state.score.toLocaleString()+'점';
  document.getElementById('result-detail').textContent = `정답률 ${pct}% · 10문제`;
  document.getElementById('rb-correct').textContent    = state.correctCount;
  document.getElementById('rb-wrong').textContent      = state.wrongCount;
  document.getElementById('rb-time').textContent       = `${state.totalTimeLeft}s`;
  document.getElementById('new-record-banner').className =
    'new-record-banner' + (isNew?' show':'');

  updateBestUI();
  showScreen('result');
}

// ══════════════════════════════════════════════════
//  UI 헬퍼
// ══════════════════════════════════════════════════
function renderHUD(){
  document.getElementById('hud-score').textContent = state.score.toLocaleString();
}

function renderProgressDots(){
  document.getElementById('progress-dots').innerHTML =
    state.questions.map((_,i)=>{
      let cls='dot';
      if(i<state.currentQ){
        cls += state.questions[i].success===false ? ' failed' : ' done';
      } else if(i===state.currentQ){
        cls += ' active';
      }
      return `<div class="${cls}"></div>`;
    }).join('');
}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(`screen-${name}`).classList.add('active');
}

function goTitle(){
  clearInterval(state.timerInterval);
  (state.spawnTimers||[]).forEach(t=>clearTimeout(t));
  updateBestUI();
  showScreen('title');
}

let toastTimeout;
function showToast(msg, type='info'){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=`show t-${type}`;
  clearTimeout(toastTimeout);
  toastTimeout=setTimeout(()=>{ t.className=''; }, 2000);
}

// 초기 최고 점수
updateBestUI();
</script>
